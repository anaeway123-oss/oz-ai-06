<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 암호화폐 가격 변동 추적기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h1>실시간 암호화폐 가격 변동 추적기</h1>

    <div class="card">

      <!-- 탭: 전체보기 / 관심목록 -->
      <div class="tabs">
        <button id="tabAll" class="tab active">전체보기</button>
        <button id="tabFav" class="tab">관심목록</button>
      </div>

      <!-- 검색창 -->
      <input
        id="searchInput"
        type="text"
        class="search"
        placeholder="심볼 검색 (예: BTCUSDT)"
      />

      <!-- 표 -->
      <table>
        <thead>
          <tr>
            <th class="col-star">관심</th>
            <th class="col-symbol">심볼</th>
            <th class="col-num">현재가</th>
            <th class="col-num">24시간 변동률</th>
            <th class="col-num">최고가</th>
            <th class="col-num">최저가</th>
          </tr>
        </thead>
        <!-- JS가 이 안에 <tr>들을 채워 넣습니다 -->
        <tbody id="tableBody">
          <tr>
            <td colspan="6" class="loading">데이터를 불러오는 중...</td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
