<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삐약삐약! 병아리 계산기</title>
    <!-- 귀여운 병아리 테마 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* 부드러운 파스텔톤 배경 */
            background: linear-gradient(160deg, #fff9c4 0%, #fff176 100%);
            font-family: 'Jua', sans-serif; /* 적용한 폰트 */
            margin: 0;
        }
        .calculator {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(158, 157, 36, 0.2);
            width: 350px;
            position: relative;
            border: 5px solid #fff176;
        }
        
        /* 계산기 상단 병아리 아이콘 */
        .chick-top {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: url('https://cdn-icons-png.flaticon.com/512/6723/6723025.png') no-repeat center;
            background-size: contain;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: #fffde7;
            color: #3e2723;
            font-size: 3rem;
            text-align: right;
            padding: 0 20px;
            box-sizing: border-box;
            border: 3px solid #fbc02d;
            border-radius: 20px;
            margin-bottom: 25px;
            font-family: 'Jua', sans-serif;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            padding: 20px;
            font-size: 2rem;
            border: none;
            border-radius: 50%; /* 원형 버튼 */
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Jua', sans-serif;
            color: #3e2723;
            box-shadow: 0 5px 0 rgba(0,0,0,0.08); /* 버튼 입체감 */
            position: relative;
            overflow: hidden; /* 병아리가 버튼 밖으로 안 나가게 */
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 rgba(0,0,0,0.08);
        }
        
        /* 버튼 상태별 배경색 및 병아리 배경 */
        button.num {
            background-color: #fff59d; /* 연노랑 */
        }
        button.num:hover { background-color: #fff176; }

        button.operator {
            background-color: #ffb74d; /* 주황색 */
            color: white;
        }
        button.operator:hover { background-color: #ffa726; }

        button.clear {
            background-color: #ef5350; /* 빨간색 */
            color: white;
            grid-column: span 2;
            border-radius: 40px;
        }
        button.clear:hover { background-color: #e53935; }

        button.equal {
            background-color: #8bc34a; /* 초록색 */
            color: white;
            grid-column: span 2;
            border-radius: 40px;
            font-weight: bold;
        }
        button.equal:hover { background-color: #7cb342; }

        /* 0 버튼 스타일 */
        button.btn-0 {
            grid-column: span 2;
            border-radius: 40px;
        }

        /* 버튼 클릭 시 병아리가 튀어나오는 효과 (CSS 애니메이션) */
        @keyframes peepOut {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        /* 병아리 아이콘을 버튼의 가상 요소로 추가 */
        button::after {
            content: '';
            position: absolute;
            bottom: -60px; /* 버튼 아래 숨김 */
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: url('https://cdn-icons-png.flaticon.com/512/6723/6723025.png') no-repeat center;
            background-size: contain;
            transition: bottom 0.3s ease;
        }

        button:hover::after {
            bottom: 10px; /* 호버 시 병아리가 튀어오름 */
            animation: peepOut 0.3s ease; /* 튀어오르는 애니메이션 */
        }

    </style>
</head>
<body>

<div class="calculator">
    <div class="chick-top"></div> <!-- 계산기 위 병아리 -->
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">지우기 C</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        
        <button class="num" onclick="appendValue('7')">7</button>
        <button class="num" onclick="appendValue('8')">8</button>
        <button class="num" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button class="num" onclick="appendValue('4')">4</button>
        <button class="num" onclick="appendValue('5')">5</button>
        <button class="num" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button class="num" onclick="appendValue('1')">1</button>
        <button class="num" onclick="appendValue('2')">2</button>
        <button class="num" onclick="appendValue('3')">3</button>
        <button class="num" onclick="appendValue('.')">.</button>
        
        <button class="equal" onclick="calculate()">= (결과)</button>
        <button class="num btn-0" onclick="appendValue('0')">0</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        if (display.value === '0' && val !== '.') {
            display.value = val;
        } else {
            display.value += val;
        }
    }

    function clearDisplay() {
        display.value = '0';
    }

    function calculate() {
        try {
            // eval 함수를 안전하게 사용하여 수식 계산
            let result = eval(display.value.replace(/×/g, '*').replace(/÷/g, '/'));
            
            // 결과가 소수일 경우 적당히 반올림하여 표시
            if (!Number.isInteger(result)) {
                result = parseFloat(result.toFixed(6));
            }
            display.value = result;
            
        } catch (error) {
            display.value = '삐약 오류 발생!';
            setTimeout(clearDisplay, 2000);
        }
    } 
</script>

</body>
</html>
